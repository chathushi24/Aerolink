apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: aerolink
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: 146697354183.dkr.ecr.us-east-1.amazonaws.com/dev-aerolink-payment-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
        env:
        - name: AWS_REGION
          value: "us-east-1"
        - name: PAYMENTS_TABLE_NAME
          value: "dev-PaymentsTable"
        - name: SQS_PAYMENT_GATEWAY_QUEUE_URL
          value: "https://sqs.us-east-1.amazonaws.com/146697354183/dev-aerolink-PaymentGatewayQueue"
        - name: JWT_SECRET
          value: "aerolink-super-secret-jwt-key-2026"
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: aerolink
spec:
  selector:
    app: payment-service
  ports:
    - protocol: TCP
      port: 8004
      targetPort: 8004
  type: ClusterIP
